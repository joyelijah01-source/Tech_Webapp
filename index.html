<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Crush</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #c8102e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        p {
            max-width: 640px;
            margin: 0.5rem 1rem;
            line-height: 1.6;
        }

        .content {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #ffffff;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Welcome to Tech Crush</h1>
        <p>This is a simple web page about technology and innovation.</p>
        <p>Explore the world of tech!</p>
    </div>
</body>
</html>
